# Codemagic 云编译配置：把 WebRTCiOS 编译成"未签名 IPA"
# 用法：把本文件 push 到 GitHub，在 Codemagic 网站连接 webrtc-ios 仓库后，
#      选中下面这个 workflow 点 "Start new build" 即可。
# 免费账号每月有 500 分钟 macOS 构建时间，编一次约 10-20 分钟，够用。

workflows:
  build-unsigned-ipa:
    name: 编译 WebRTCiOS 未签名 IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      # 工程用 Swift 5 + iOS 16 部署目标，用最新 Xcode 即可
      xcode: latest
      vars:
        XCODE_PROJECT: WebRTCiOS.xcodeproj
        XCODE_SCHEME: WebRTCiOS

    scripts:
      - name: 安装 xcodegen
        # 手写工程没有共享 scheme，命令行 archive 需要它按 project.yml 重新生成一份
        script: brew install xcodegen

      - name: 用 project.yml 重新生成工程（含共享 scheme）
        script: xcodegen generate

      - name: 拉取 WebRTC Swift 包（约 100MB+，首次较慢）
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: 编译并归档（不签名）
        script: |
          set -o pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/WebRTCiOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            -skipPackagePluginValidation \
            2>&1 | tee "$CM_BUILD_DIR/build.log"

      - name: 打包成未签名 IPA
        script: |
          set -e
          APP="$CM_BUILD_DIR/WebRTCiOS.xcarchive/Products/Applications/WebRTCiOS.app"
          if [ ! -d "$APP" ]; then
            echo "找不到编译产物：$APP"
            exit 1
          fi
          cd "$CM_BUILD_DIR"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WebRTCiOS-unsigned.ipa Payload
          ls -lh WebRTCiOS-unsigned.ipa

    # 构建完成后可在网页下载这些文件；失败时也能拿到 build.log 排错
    artifacts:
      - $CM_BUILD_DIR/WebRTCiOS-unsigned.ipa
      - $CM_BUILD_DIR/build.log
